<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELP THE COW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --u: 4px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #05040d; color: #fff;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  html, body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: pointer; }
  canvas { position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .crt { position: absolute; inset: 0; pointer-events: none; z-index: 20;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--u)*.5), rgba(0,0,0,.2) calc(var(--u)*.5), rgba(0,0,0,.2) var(--u)); }
  .vig { position: absolute; inset: 0; pointer-events: none; z-index: 21;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.6) 100%); }
  #danger { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    box-shadow: inset 0 0 calc(var(--u)*18) calc(var(--u)*5) rgba(255,30,70,.8); }

  .shadow { text-shadow: calc(var(--u)*.75) calc(var(--u)*.75) 0 #000; }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 6; display: none; }
  .hud-row { position: absolute; top: calc(var(--u)*4); left: calc(var(--u)*5); right: calc(var(--u)*5);
    display: flex; justify-content: space-between; font-size: calc(var(--u)*5); }
  .hud-row > div:nth-child(2) { text-align: center; }
  .hud-row > div:nth-child(3) { text-align: right; }
  .lbl { display: block; color: #7fe3ff; font-size: calc(var(--u)*3); margin-bottom: calc(var(--u)*1.5); }
  #hudTime.hot { color: #ff3d5a; animation: blink .3s steps(1) infinite; }
  #meter { position: absolute; right: calc(var(--u)*6); top: calc(var(--u)*24);
    width: calc(var(--u)*6); height: calc(var(--u)*72);
    border: var(--u) solid #fff; background: #0b0a22; box-shadow: calc(var(--u)*.75) calc(var(--u)*.75) 0 #000; }
  #meterFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #5cff7a; }
  #meter::after { content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(to top, transparent 0, transparent calc(var(--u)*3), #0b0a22 calc(var(--u)*3), #0b0a22 calc(var(--u)*4)); }
  #meterLbl { position: absolute; right: calc(var(--u)*3.5); top: calc(var(--u)*98); width: calc(var(--u)*11);
    text-align: center; font-size: calc(var(--u)*3); color: #7fe3ff; }
  #calfMark { position: absolute; right: calc(var(--u)*14); width: calc(var(--u)*4); height: calc(var(--u)*3); background: #c47a45; border: calc(var(--u)*.5) solid #fff; display: none; animation: blink .4s steps(1) infinite; }
  #msg { position: absolute; left: 0; right: 0; top: calc(var(--u)*22); text-align: center;
    font-size: calc(var(--u)*6); color: #ff6ad5; display: none; }
  #msg.on { display: block; animation: blink .25s steps(1) infinite; }
  #msg.red { color: #ff3d5a; }
  #msg.warn { color: #ffe14d; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(var(--u)*5); text-align: center;
    font-size: calc(var(--u)*3.5); color: #ffe14d; animation: blink .6s steps(1) infinite; }

  /* Screens */
  .screen { position: absolute; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--u)*4); background: rgba(4,3,18,.62); overflow: hidden; }
  .screen.on { display: flex; }
  .inner { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*4);
    flex-shrink: 0; transform-origin: center center; }
  .nw { white-space: nowrap; }
  h1 { font-size: calc(var(--u)*13); line-height: 1.15; color: #ffe14d; font-weight: normal;
    text-shadow: var(--u) var(--u) 0 #ff3d7f, calc(var(--u)*2) calc(var(--u)*2) 0 #3a157a, calc(var(--u)*3) calc(var(--u)*3) 0 #000; }
  h2 { font-size: calc(var(--u)*9); font-weight: normal; line-height: 1.2;
    text-shadow: var(--u) var(--u) 0 #3a157a, calc(var(--u)*2) calc(var(--u)*2) 0 #000; }
  h2.pink { color: #ff3d7f; } h2.yellow { color: #ffe14d; }
  .p { font-size: calc(var(--u)*3.5); line-height: 1.8; color: #d9d6ff; max-width: calc(var(--u)*170); }
  .p b { color: #7fe3ff; font-weight: normal; }
  .stats { font-size: calc(var(--u)*4); line-height: 2; color: #fff; }
  .stats .rank { color: #5cff7a; margin-top: calc(var(--u)*3); }
  .sum { display: grid; grid-template-columns: auto auto auto; column-gap: calc(var(--u)*4); row-gap: calc(var(--u)*1); align-items: baseline; }
  .sum .l { text-align: left; } .sum .n { text-align: right; color: #7fe3ff; }
  .sum .d { text-align: left; color: #8f8ad6; font-size: calc(var(--u)*3); }
  .sum .rule { grid-column: 1 / -1; height: calc(var(--u)*.75); background: #d9d6ff; margin: calc(var(--u)*1) 0; }
  .sum .tot { color: #ffe14d; font-size: calc(var(--u)*5); }
  .dim { color: #8f8ad6; font-size: calc(var(--u)*3); }
  .stats .rec { color: #ffe14d; animation: blink .4s steps(1) infinite; }
  .btn { font-family: inherit; font-size: calc(var(--u)*5); color: #fff; background: #ff3d7f; cursor: pointer;
    border: var(--u) solid #fff; padding: calc(var(--u)*3) calc(var(--u)*5);
    box-shadow: var(--u) var(--u) 0 #000, calc(var(--u)*2) calc(var(--u)*2) 0 #3a157a; }
  .btn:hover { background: #ff5c95; }
  .btn:active { transform: translate(var(--u), var(--u)); box-shadow: 0 0 0 #000; }
  .btn.blink { animation: blink 1s steps(1) infinite; }
  .btn.locked { opacity: .35; pointer-events: none; animation: none; }
  .ctrl { font-size: calc(var(--u)*6); color: #7fe3ff; }
  .bonus { font-size: calc(var(--u)*4.5); color: #ffe14d; margin-top: calc(var(--u)*2); margin-bottom: calc(var(--u)*-2.5); }
  .mob { display: none; }
  @media (pointer: coarse) { .desk { display: none; } .mob { display: inline; } .p { font-size: calc(var(--u)*4.2); } }
  .yel { color: #ffe14d; }
  .startTxt { font-family: inherit; font-size: calc(var(--u)*5); color: #7fe3ff; background: none; border: 0;
    margin-top: calc(var(--u)*4); cursor: pointer; text-shadow: calc(var(--u)*.75) calc(var(--u)*.75) 0 #000; }
  #scrTitle { cursor: pointer; }
  .small { font-size: calc(var(--u)*3); color: #8f8ad6; }
  #count { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
    font-size: calc(var(--u)*28); color: #ffe14d; pointer-events: none;
    text-shadow: calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #ff3d7f, calc(var(--u)*3) calc(var(--u)*3) 0 #000; }
  #count.on { display: flex; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="danger"></div>

  <div id="hud" class="shadow">
    <div class="hud-row">
      <div><span class="lbl">TIEMPO</span><span id="hudTime">60</span></div>
      <div><span class="lbl">PUNTOS</span><span id="hudScore">000000</span></div>
      <div><span class="lbl">RÉCORD</span><span id="hudBest">000000</span></div>
    </div>
    <div id="meter"><div id="meterFill"></div></div>
    <div id="meterLbl">OVNI</div>
    <div id="calfMark"></div>
    <div id="msg"></div>
    <div id="hint"><span class="desk">¡CLICK! ¡CLICK! ¡CLICK!</span><span class="mob">¡TAP! ¡TAP! ¡TAP!</span></div>
  </div>

  <div id="count"></div>

  <div id="scrTitle" class="screen on shadow"><div class="inner">
    <h1>HELP<br>THE COW</h1>
    <p class="p nw">Salva a la vaca del OVNI<br>antes de los 60 segundos.</p>
    <p class="p nw yel">BONUS VAQUITA<br>Sube a rescatarla<br>y tráela al pasto.</p>
    <button class="startTxt blink nw" id="btnStart"><span class="desk">CLICK / SPACEBAR TO START</span><span class="mob">TAP TO START</span></button>
    <div id="titleBest" hidden></div>
  </div></div>

  <div id="scrEnd" class="screen shadow"><div class="inner">
    <h2 id="endTitle" class="pink nw">¡ABDUCIDA!</h2>
    <p class="p nw" id="endSub"></p>
    <div class="stats nw" id="endStats"></div>
    <button class="btn" id="btnAgain">OTRA VEZ</button>
  </div></div>

  <div class="crt"></div>
  <div class="vig"></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), g = cv.getContext('2d');
let W = 192, H = 144, GROUND = 118, COWX = 118, UFO_Y = 30, MX = 34, MY = 22;
const DUR = 60, CLICK = 0.05, WIN_BONUS = 3000;

/* ---------- helpers ---------- */
let seed = 7;
const srnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)] / 16;
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- sizing: fill the whole window (landscape on desktop, portrait on phones) ---------- */
let lastIW = 0, lastIH = 0;
function fitScreens() {
  document.querySelectorAll('.screen.on .inner').forEach(el => {
    el.style.transform = 'none';
    const sc = el.parentElement, cs = getComputedStyle(sc);
    const aw = sc.clientWidth - parseFloat(cs.paddingLeft) * 2, ah = sc.clientHeight - parseFloat(cs.paddingTop) * 2;
    const k = Math.min(1, aw / el.scrollWidth, ah / el.scrollHeight);
    if (k < 1) el.style.transform = 'scale(' + k + ')';
  });
}
function fit() {
  const vv = window.visualViewport;
  const iw = Math.round(vv ? vv.width : innerWidth), ih = Math.round(vv ? vv.height : innerHeight);
  stage.style.left = (vv ? vv.offsetLeft : 0) + 'px'; stage.style.top = (vv ? vv.offsetTop : 0) + 'px';
  stage.style.width = iw + 'px'; stage.style.height = ih + 'px';
  stage.style.right = 'auto'; stage.style.bottom = 'auto';
  fitScreens();
  if (iw === lastIW && ih === lastIH && W) return;
  lastIW = iw; lastIH = ih;
  window.scrollTo(0, 0);
  // on tall (phone) screens use a narrower world so the pixels come out bigger
  let s = ih > iw * 1.1 ? Math.min(iw / 128, ih / 200) : Math.min(iw / 192, ih / 144);
  if (s >= 2) s = Math.floor(s);
  W = Math.ceil(iw / s); H = Math.ceil(ih / s);
  GROUND = H - 26;
  const portrait = H > W * 1.1;
  COWX = Math.round(W * 0.5 + 22);
  UFO_Y = portrait ? Math.round(Math.min(H * 0.2, GROUND - 100)) : 30;
  MY = portrait ? Math.round(UFO_Y * 0.55) + 8 : 22;
  cv.width = W; cv.height = H;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  document.documentElement.style.setProperty('--u', s + 'px');
  paintBG(); makeStars(); fitScreens();
}

/* ---------- static background ---------- */
const bg = document.createElement('canvas');
function paintBG() {
  seed = 7;
  bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  const P = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(x, y, w, h); };
  const o = GROUND - 118; // everything on the horizon is drawn relative to the ground line
  // sky
  const sky = ['#06061c','#0a0a28','#0f0e36','#151444','#1d1a52','#271f60'];
  const skyH = Math.max(60, GROUND - 18);
  for (let y = 0; y < GROUND; y++) for (let x = 0; x < W; x++) {
    const f = Math.min(y / skyH * 5, 5), i = Math.floor(f), fr = f - i;
    P(x, y, 1, 1, (i < 5 && bay(x, y) < fr) ? sky[i + 1] : sky[i]);
  }
  // moon + glow
  for (let y = MY - 14; y <= MY + 14; y++) for (let x = MX - 14; x <= MX + 14; x++) {
    const d = Math.hypot(x - MX, y - MY);
    if (d <= 9) P(x, y, 1, 1, (x - MX) + (y - MY) > 7 ? '#d9d2b0' : '#f3edd0');
    else if (d < 13.5 && bay(x, y) < (13.5 - d) / 4.5 * 0.6) P(x, y, 1, 1, '#3a3478');
  }
  const crater = (x0, y0, r) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x*x + y*y <= r*r) P(x0 + x, y0 + y, 1, 1, '#d2caa4'); };
  crater(MX - 3, MY - 3, 2); crater(MX + 3, MY + 3, 1); crater(MX + 3, MY - 4, 1); crater(MX - 4, MY + 4, 1);
  // from here on: horizon objects, shifted down to the ground line
  b.setTransform(1, 0, 0, 1, 0, o);
  // hills
  for (let x = 0; x < W; x++) {
    const y1 = Math.round(90 + Math.sin(x * 0.045 + 1) * 5 + Math.sin(x * 0.11) * 2);
    P(x, y1, 1, 118 - y1, '#131b42');
  }
  const fx = Math.round(W * 0.69);
  P(fx, 96, 1, 1, '#f7d154'); P(fx + 2, 96, 1, 1, '#f7d154'); // far-away farmhouse
  for (let x = 0; x < W; x++) {
    const y2 = Math.round(101 + Math.sin(x * 0.07 + 3) * 4 + Math.sin(x * 0.19) * 1.5);
    P(x, y2, 1, 118 - y2, '#0f2431');
  }
  // tree (anchored to the right edge)
  const blob = (cx, cy, r, c, dither) => {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
      if (x*x + y*y <= r*r && (!dither || bay(cx + x, cy + y + o) < 0.5)) P(cx + x, cy + y, 1, 1, c);
  };
  const tx = W - 192;
  P(176 + tx, 98, 4, 20, '#24160f');
  blob(178 + tx, 89, 9, '#0b2216'); blob(170 + tx, 96, 6, '#0b2216'); blob(186 + tx, 95, 6, '#0b2216');
  blob(175 + tx, 86, 5, '#163a26', true); blob(168 + tx, 94, 3, '#163a26', true);
  // barn
  const TRIM = '#a89a86', BC = 30, BX = 10, BW = 40, WT = 88;
  for (let i = 0; i <= 18; i++) {
    const y = 70 + i, hw = Math.round(i < 7 ? 5 + i * 2.3 : 21 + (i - 7) * 0.12);
    P(BC - hw, y, hw * 2, 1, '#4a1420');
    P(BC - hw, y, 1, 1, TRIM); P(BC + hw - 1, y, 1, 1, TRIM);
  }
  P(BX, WT, BW, 118 - WT, '#6e1a24');
  for (let x = BX + 3; x < BX + BW; x += 4) P(x, WT, 1, 118 - WT, '#5e1620');
  P(BX, WT, 1, 118 - WT, TRIM); P(BX + BW - 1, WT, 1, 118 - WT, TRIM); P(BX, WT, BW, 1, TRIM);
  // loft window (lit)
  P(26, 75, 9, 8, TRIM); P(27, 76, 7, 6, '#f7d154'); P(28, 77, 2, 1, '#fff2a8');
  P(30, 76, 1, 6, TRIM); P(27, 78, 7, 1, TRIM);
  // door with X
  const DX = 20, DY = 98, DW = 21, DH = 20;
  P(DX, DY, DW, DH, '#56131c');
  P(DX, DY, DW, 1, TRIM); P(DX, DY, 1, DH, TRIM); P(DX + DW - 1, DY, 1, DH, TRIM); P(DX + 10, DY, 1, DH, TRIM);
  for (let k = 0; k < DH; k++) {
    const q = Math.round(k * 10 / (DH - 1));
    P(DX + q, DY + k, 1, 1, TRIM); P(DX + 10 - q, DY + k, 1, 1, TRIM);
    P(DX + 10 + q, DY + k, 1, 1, TRIM); P(DX + 20 - q, DY + k, 1, 1, TRIM);
  }
  // silo
  P(52, 80, 11, 38, '#4f5870'); P(60, 80, 3, 38, '#434b61');
  for (let y = 84; y < 118; y += 6) P(52, y, 11, 1, '#3a4258');
  [3, 7, 9, 11, 11].forEach((w, i) => P(52 + (11 - w) / 2, 75 + i, w, 1, '#6b7690'));
  b.setTransform(1, 0, 0, 1, 0, 0);
  // ground
  const gr = ['#1a3d1c','#153218','#102713'];
  for (let y = GROUND; y < H; y++) for (let x = 0; x < W; x++) {
    const f = Math.min((y - GROUND) / (H - GROUND) * 2, 2), i = Math.floor(f), fr = f - i;
    P(x, y, 1, 1, (i < 2 && bay(x, y) < fr) ? gr[i + 1] : gr[i]);
  }
  P(0, GROUND, W, 1, '#24502a');
  for (let n = 0, N = Math.round(90 * W / 192); n < N; n++) {
    const x = srnd() * W | 0, y = GROUND + 3 + (srnd() * (H - GROUND - 4) | 0);
    const c = srnd() < 0.08 ? '#e9e3ff' : '#2b5a2c';
    P(x, y, 1, 1, c); if (c !== '#e9e3ff') { P(x + 1, y - 1, 1, 1, c); P(x + 2, y, 1, 1, c); }
  }
  // fence
  P(66, GROUND - 8, W - 66, 1, '#4d3726'); P(66, GROUND - 4, W - 66, 1, '#4d3726');
  for (let x = 66; x < W; x += 12) { P(x, GROUND - 12, 2, 13, '#3b2a1b'); P(x, GROUND - 12, 2, 1, '#6a5038'); }
}

/* ---------- stars ---------- */
let stars = [];
function makeStars() {
  stars = [];
  const top = Math.max(20, GROUND - 52);
  const n = Math.round(55 * (W * top) / (192 * 66));
  while (stars.length < n) {
    const x = srnd() * W | 0, y = 2 + (srnd() * top | 0);
    if (Math.hypot(x - MX, y - MY) < 15) continue;
    stars.push({ x, y, sp: 1 + srnd() * 3, ph: srnd() * 6.28, big: srnd() < 0.12 });
  }
}
let shoot = null, nextShoot = 4;

/* ---------- cow sprite ---------- */
const COW_TOP = [
  '..............H..H',
  '.............KWWWK',
  '.............WKWKW',
  '.KWWWWKKWWWWWWWWWW',
  '.KWWWKKKWWWKWPPPPP',
  '.KWWWWKWWWKKWPKPKP',
  'K.WWWWWWWWKKW.PPP.',
  '..WKKWWWWWWWW.....',
  '..WWWWWWPPWWW.....',
];
const LEGS = [
  ['..K.K..PP.K.K.....', '..K.K.....K.K.....', '..G.G.....G.G.....'],
  ['..K.K..PP.K.K.....', '.K...K...K...K....', '.G...G...G...G....'],
];
const COWC = { W: '#f4f1e8', K: '#1b1b1f', P: '#f29bb0', H: '#d9c79a', G: '#5a5a62', B: '#b06a3c' };
function drawSprite(rows, x, bottom) {
  const top = Math.round(bottom) - rows.length, left = Math.round(x) - (rows[0].length >> 1);
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c]; if (ch === '.') continue;
      g.fillStyle = COWC[ch]; g.fillRect(left + c, top + r, 1, 1);
    }
  }
}
const drawCow = (x, bottom, frame) => drawSprite(COW_TOP.concat(LEGS[frame]), x, bottom);
const CALF_TOP = [
  '........B..B',
  '........WWWW',
  '........KWKW',
  '.BWWBWWWWPPP',
  '.WWWWWBBWPKP',
  'B.WBWWWWW...',
];
const CALF_LEGS = [
  ['..B.B..B.B..', '..G.G..G.G..'],
  ['.B...B.B...B', '.G...G.G...G'],
];
const drawCalf = (x, bottom, frame) => drawSprite(CALF_TOP.concat(CALF_LEGS[frame]), x, bottom);

/* ---------- UFO + beam ---------- */
function drawUFO(cx, cy, t, warn, beamOn, alt) {
  cx = Math.round(cx); cy = Math.round(cy);
  const C = alt ? ['#ffd0f0','#ff8ad8','#ffb03b','#d4c8e8','#9a8cb8','#6c5f8a','#4f4466'] : ['#bff4ff','#7fd6f0','#3bd16f','#c9d0dc','#9099ab','#636b7e','#4a5163'];
  for (let y = -6; y <= 0; y++) {
    const w = Math.round(Math.sqrt(42 - y * y));
    R(cx - w, cy - 1 + y, w * 2, 1, y < -3 ? C[0] : C[1]);
  }
  R(cx - 1, cy - 5, 3, 3, C[2]); R(cx - 1, cy - 4, 1, 1, '#000'); R(cx + 1, cy - 4, 1, 1, '#000');
  R(cx - 4, cy - 6, 1, 1, '#fff');
  R(cx - 14, cy - 1, 28, 1, C[3]);
  R(cx - 20, cy, 40, 2, C[4]);
  R(cx - 17, cy + 2, 34, 1, C[5]);
  R(cx - 10, cy + 3, 20, 1, C[6]);
  R(cx - 5, cy + 4, 10, 1, beamOn ? '#d6ffb0' : '#3a4050');
  const cols = ['#ff3d7f', '#ffe14d', '#5cf2ff'];
  for (let i = 0; i < 7; i++) {
    let c = cols[(i + Math.floor(t * 8)) % 3];
    if (warn) c = (Math.floor(t * 12) % 2) ? '#ff2244' : '#4a0010';
    R(cx - 18 + i * 6, cy, 2, 1, c);
  }
}
function drawBeam(cx, cy, str, t, surge) {
  cx = Math.round(cx);
  const top = Math.round(cy) + 5, bot = GROUND + 5;
  for (let y = top; y < bot; y++) {
    const k = (y - top) / (bot - top), hw = Math.round(5 + k * 18);
    const stripe = (((y - t * 34) % 6) + 6) % 6 < 2;
    let a = (0.13 + (stripe ? 0.12 : 0)) * str * (surge ? 1.6 : 1);
    g.fillStyle = surge ? `rgba(255,110,220,${a})` : `rgba(150,255,140,${a})`;
    g.fillRect(cx - hw, y, hw * 2, 1);
  }
  for (let y = -4; y <= 4; y++) for (let x = -26; x <= 26; x++) {
    const d = (x * x) / 676 + (y * y) / 16;
    if (d < 1 && bay(cx + x, GROUND + 4 + y) < (1 - d) * 0.7 * str)
      R(cx + x, GROUND + 4 + y, 1, 1, surge ? '#7a3a7a' : '#3f7a3c');
  }
}

function drawBeam2(ux, uy, tx, ty, str, t) {
  const top = Math.round(uy) + 5, bot = Math.round(ty);
  if (bot <= top) return;
  for (let y = top; y <= bot; y++) {
    const k = (y - top) / (bot - top), hw = Math.round(4 + k * 9), x = Math.round(lerp(ux, tx, k));
    const stripe = (((y - t * 40) % 5) + 5) % 5 < 2;
    g.fillStyle = `rgba(200,120,255,${(0.16 + (stripe ? 0.14 : 0)) * str})`;
    g.fillRect(x - hw, y, hw * 2, 1);
  }
}

/* ---------- audio ---------- */
let ac = null, muted = false, hum = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
function blip(f, d, type = 'square', vol = 0.05, slide = 0, at = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + at, o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(gn).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function moo(up = false, at = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + at, o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(up ? 150 : 135, t0);
  o.frequency.linearRampToValueAtTime(up ? 420 : 105, t0 + 0.7);
  f.type = 'lowpass'; f.frequency.setValueAtTime(500, t0); f.frequency.linearRampToValueAtTime(900, t0 + 0.3);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.linearRampToValueAtTime(0.09, t0 + 0.08);
  gn.gain.linearRampToValueAtTime(0.0001, t0 + 0.75);
  o.connect(f).connect(gn).connect(ac.destination); o.start(t0); o.stop(t0 + 0.8);
}
function startHum() {
  if (!ac || hum) return;
  const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), f = ac.createBiquadFilter(), gn = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = 70;
  lfo.frequency.value = 7; lg.gain.value = 6; lfo.connect(lg).connect(o.frequency);
  f.type = 'lowpass'; f.frequency.value = 700; gn.gain.value = 0;
  o.connect(f).connect(gn).connect(ac.destination); o.start(); lfo.start();
  hum = { o, lfo, gn };
}
function stopHum() {
  if (!hum || !ac) return;
  const h0 = hum; hum = null;
  h0.gn.gain.setTargetAtTime(0, ac.currentTime, 0.08);
  setTimeout(() => { try { h0.o.stop(); h0.lfo.stop(); } catch (e) {} }, 400);
}
function updateHum() {
  if (!hum || !ac) return;
  const now = ac.currentTime;
  hum.o.frequency.setTargetAtTime(70 + h * 190 + (surgeOn ? 60 : 0), now, 0.05);
  hum.gn.gain.setTargetAtTime(muted ? 0 : 0.025 + h * 0.045, now, 0.05);
}
const tune = (notes, step, type = 'square', vol = 0.05) => notes.forEach((n, i) => n && blip(n, step * 0.9, type, vol, 0, i * step));

/* ---------- state ---------- */
let state = 'title', T = 0, elapsed = 0, h = 0, drawH = 0, hv = 0, clicks = 0, score = 0;
let countdown = 0, endT = 0, endShown = false, beamStr = 0, exitX = 0, exitY = 0, exitV = 0;
let surges = [], surgeOn = false, warn = false, last10 = false, flash = null;
let calf = null, calfTimes = [], saved = 0;
const UFO2_AT = 44, ufo2 = { on: false, t: 0, beam: 0 };
const parts = [];
let best = 0;
try { best = parseInt(localStorage.getItem('htc_best') || '0', 10) || 0; } catch (e) {}
const pad = n => String(n).padStart(6, '0');
$('titleBest').textContent = 'RÉCORD ' + pad(best);

const rate = t => 0.10 + 0.19 * Math.pow(t / DUR, 1.3) + 0.02 * Math.sin(t * 1.9);

function start() {
  initAudio();
  elapsed = 0; h = 0; drawH = 0; hv = 0; clicks = 0; score = 0; endT = 0; endShown = false;
  exitX = 0; exitY = 0; exitV = 0; beamStr = 0; last10 = false; flash = null; parts.length = 0;
  surges = [13, 26, 38].map(s => s + (Math.random() * 2 - 1));
  calfTimes = [19 + Math.random() * 2, 32 + Math.random() * 2];
  calf = null; saved = 0; ufo2.on = false; ufo2.t = 0; ufo2.beam = 0;
  countdown = 3; state = 'count';
  $('scrTitle').classList.remove('on'); $('scrEnd').classList.remove('on');
  $('hud').style.display = 'block'; $('hint').style.display = 'block';
  const c = $('count'); c.textContent = '3'; c.classList.add('on');
  blip(440, 0.15);
}
function beginPlay() {
  state = 'play';
  const c = $('count'); c.textContent = '¡YA!';
  setTimeout(() => { if (state === 'play') c.classList.remove('on'); }, 600);
  blip(880, 0.3); moo(false, 0.1); startHum();
}
function hit() {
  if (state !== 'play') return;
  score += 10 + Math.round(h * 20);
  h = Math.max(0, h - CLICK * (calf && calf.st === 'carried' ? 0.8 : 1)); clicks++;
  blip(520 + Math.random() * 380, 0.05, 'square', 0.035, -200);
  const cx = COWX, bottom = lerp(GROUND + 6, UFO_Y + 6, drawH);
  for (let i = 0; i < 4; i++) parts.push({
    x: cx + (Math.random() * 16 - 8), y: bottom - Math.random() * 6,
    vx: Math.random() * 60 - 30, vy: 30 + Math.random() * 50, life: 0.4 + Math.random() * 0.3,
    c: Math.random() < 0.5 ? '#ffffff' : '#ffe14d'
  });
}
function finish(won) {
  state = won ? 'won' : 'lost'; endT = 0; hv = 0; stopHum();
  if (won && calf && calf.st === 'carried') { saved++; score += 1500; }
  if (!won) calf = null; else if (calf && calf.st === 'float') calf = null;
  if (won) { score += WIN_BONUS; tune([523, 659, 784, 1047, 0, 784, 1047], 0.11); }
  else { moo(true); tune([392, 330, 262, 196, 131], 0.16, 'triangle', 0.07); }
  $('hint').style.display = 'none'; $('count').classList.remove('on');
}
function showEnd() {
  endShown = true;
  const won = state === 'won';
  const cps = clicks / Math.max(1, elapsed);
  const rank = cps < 3 ? 'GRANJERO NOVATO' : cps < 5 ? 'PEÓN BRAVO' : cps < 7 ? 'GAUCHO GALÁCTICO' : 'LEYENDA DEL CAMPO';
  const isRec = score > best;
  if (isRec) { best = score; try { localStorage.setItem('htc_best', String(best)); } catch (e) {} }
  $('titleBest').textContent = 'RÉCORD ' + pad(best);
  const t = $('endTitle');
  t.textContent = won ? '¡VACA A SALVO!' : '¡ABDUCIDA!';
  t.className = won ? 'yellow' : 'pink';
  $('endSub').innerHTML = won ? 'Los OVNIs se fueron<br>con las manos vacías.' : 'La vaca ya va camino<br>a otra galaxia.<br><span class="dim">RESISTISTE ' + elapsed.toFixed(1) + ' S</span>';
  const bonus = (won ? WIN_BONUS : 0) + saved * 1500, clickPts = score - bonus;
  $('endStats').innerHTML =
    '<div class="sum">' +
      '<span class="l">BONUS</span><span class="n">+' + bonus + '</span><span class="d">(VAQUITAS ' + saved + '/2)</span>' +
      '<span class="l">' + clicks + ' CLICKS</span><span class="n">+' + clickPts + '</span><span class="d">(' + cps.toFixed(1) + ' / SEG)</span>' +
      '<span class="rule"></span>' +
      '<span class="l tot">TOTAL</span><span class="n tot">' + pad(score) + '</span><span class="d"></span>' +
    '</div>' +
    '<div class="rank">' + rank + '</div>' +
    (isRec ? '<div class="rec">¡NUEVO RÉCORD!</div>' : '');
  $('scrEnd').classList.add('on'); fitScreens();
  const b = $('btnAgain'); b.classList.add('locked');
  setTimeout(() => { b.classList.remove('locked'); b.classList.add('blink'); }, 1000);
}
function flashMsg(text, dur, cls) { flash = { text, until: T + dur, cls }; }

/* ---------- input ---------- */
stage.addEventListener('pointerdown', e => {
  initAudio();
  if (state === 'play') { e.preventDefault(); hit(); }
});
function press(e) {
  e.stopPropagation(); if (e.cancelable) e.preventDefault();
  if (state === 'title' || ((state === 'won' || state === 'lost') && endShown && !$('btnAgain').classList.contains('locked'))) start();
}
['scrTitle', 'btnStart', 'btnAgain'].forEach(id => { $(id).addEventListener('pointerdown', press); $(id).addEventListener('click', press); });
function toggleMute() { muted = !muted; }
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    initAudio();
    if (state === 'play') hit();
    else if (state === 'title') start();
    else if (endShown && !$('btnAgain').classList.contains('locked')) start();
  } else if (e.code === 'KeyM') toggleMute();
});
addEventListener('contextmenu', e => e.preventDefault());

/* ---------- loop ---------- */
function update(dt) {
  T += dt;
  if (state === 'count') {
    const prev = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== prev && now > 0) { $('count').textContent = now; blip(440, 0.15); }
    if (countdown <= 0) beginPlay();
  } else if (state === 'play') {
    elapsed += dt;
    beamStr = Math.min(1, beamStr + dt * 4);
    surgeOn = surges.some(s => elapsed >= s && elapsed < s + 2);
    warn = !surgeOn && surges.some(s => elapsed >= s - 0.9 && elapsed < s);
    // second UFO
    if (!ufo2.on && elapsed >= UFO2_AT) { ufo2.on = true; ufo2.t = 0; flashMsg('¡LLEGÓ OTRO OVNI!', 2.4, 'red'); tune([880, 660, 880, 660, 880, 660], 0.12, 'square', 0.04); }
    if (ufo2.on) { ufo2.t += dt; if (ufo2.t > 1.6) ufo2.beam = Math.min(1, ufo2.beam + dt * 3); }
    h += rate(elapsed) * (surgeOn ? 1.65 : 1) * (1 + 0.42 * ufo2.beam) * dt;
    // bonus calf
    if (calfTimes.length && elapsed >= calfTimes[0]) {
      calfTimes.shift();
      calf = { h: Math.min(0.72, Math.max(h + 0.3, 0.45)), st: 'float', ph: Math.random() * 6 };
      flashMsg('¡UNA VAQUITA! ¡ALCÁNZALA!', 2.5, 'warn'); tune([784, 988, 1175], 0.08, 'square', 0.04);
    }
    if (calf && calf.st === 'float') {
      calf.h += 0.05 * dt * (surgeOn ? 1.5 : 1);
      if (h >= calf.h - 0.12) { calf.st = 'carried'; flashMsg('¡LA TIENES! ¡AHORA BÁJALA!', 1.8, 'warn'); tune([659, 880], 0.08, 'square', 0.05); }
      else if (calf.h >= 1) { calf = null; flashMsg('¡SE LLEVARON LA VAQUITA!', 2, 'red'); tune([330, 262], 0.15, 'triangle', 0.06); }
    } else if (calf && calf.st === 'carried' && h <= 0.12) {
      saved++; score += 1500; calf = null;
      flashMsg('¡VAQUITA A SALVO! +1500', 2.2, ''); tune([523, 659, 784, 1047], 0.08, 'square', 0.05);
    }
    if (!last10 && elapsed >= DUR - 10) { last10 = true; flashMsg('¡ÚLTIMOS 10!', 1.6, 'red'); blip(988, 0.2, 'square', 0.05, 0); blip(988, 0.2, 'square', 0.05, 0, 0.25); }
    if (h >= 1) { h = 1; finish(false); }
    else if (elapsed >= DUR) { elapsed = DUR; finish(true); }
  } else if (state === 'lost') {
    endT += dt; surgeOn = false; warn = false;
    if (endT < 0.9) h = Math.min(1.3, h + dt * 0.5);
    else { exitV += dt * 160; exitX += exitV * dt * 0.7; exitY -= exitV * dt; beamStr = Math.max(0, beamStr - dt * 5); }
    if (endT > 2.3 && !endShown) showEnd();
  } else if (state === 'won') {
    endT += dt; surgeOn = false; warn = false;
    beamStr = Math.max(0, beamStr - dt * 3);
    hv += dt * 3.2; h -= hv * dt;
    if (h <= 0) { h = 0; if (hv > 0.25) { hv = -hv * 0.35; blip(160, 0.08, 'triangle', 0.08); } else hv = 0; }
    if (endT > 0.5) { exitV += dt * 140; exitX -= exitV * dt * 0.8; exitY -= exitV * dt; }
    if (endT < 1.6 && Math.random() < 0.6) parts.push({
      x: Math.random() * W, y: -2, vx: Math.random() * 20 - 10, vy: 20 + Math.random() * 30, life: 3,
      c: ['#ff3d7f', '#ffe14d', '#5cf2ff', '#5cff7a'][Math.random() * 4 | 0], conf: true
    });
    if (endT > 1.0 && endT < 1.05) moo(false);
    if (endT > 2.3 && !endShown) showEnd();
  }
  if (state === 'lost' || state === 'won') ufo2.beam = Math.max(0, ufo2.beam - dt * 4);
  drawH += (h - drawH) * Math.min(1, dt * 18);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.conf ? 10 : 140) * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H) parts.splice(i, 1);
  }
  if (T > nextShoot && !shoot) { shoot = { x: W * 0.35 + Math.random() * W * 0.6, y: 3 + Math.random() * 18, life: 0.55 }; }
  if (shoot) { shoot.x -= 110 * dt; shoot.y += 50 * dt; shoot.life -= dt; if (shoot.life <= 0) { shoot = null; nextShoot = T + 5 + Math.random() * 8; } }
  updateHum();
}

function draw() {
  let sx = 0, sy = 0;
  if (state === 'play' && h > 0.72) { const a = h > 0.88 ? 2 : 1; sx = Math.round((Math.random() * 2 - 1) * a); sy = Math.round((Math.random() * 2 - 1) * a); }
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.setTransform(1, 0, 0, 1, sx, sy);
  g.drawImage(bg, 0, 0);
  for (const s of stars) {
    const tw = Math.sin(T * s.sp + s.ph);
    R(s.x, s.y, 1, 1, tw > 0.6 ? '#ffffff' : tw > -0.3 ? '#b9b9ee' : '#5b5ba8');
    if (s.big && tw > 0.6) { R(s.x - 1, s.y, 1, 1, '#7a7ad0'); R(s.x + 1, s.y, 1, 1, '#7a7ad0'); R(s.x, s.y - 1, 1, 1, '#7a7ad0'); R(s.x, s.y + 1, 1, 1, '#7a7ad0'); }
  }
  if (shoot) for (let i = 0; i < 7; i++) R(shoot.x + i * 2, shoot.y - i, 2, 1, i === 0 ? '#ffffff' : i < 3 ? '#b9b9ee' : '#5b5ba8');

  const baseX = COWX + Math.sin(T * 0.8) * 3, baseY = UFO_Y + Math.sin(T * 1.7) * 1.5;
  const cx = baseX + exitX, cy = baseY + exitY;
  for (let i = 0; i < saved; i++) drawCalf(18 + i * 16, GROUND + 9, 0);
  if (beamStr > 0.01) drawBeam(cx, cy, beamStr, T, surgeOn);

  const cowBottom = lerp(GROUND + 6, baseY + 6, drawH);
  const cowX = lerp(COWX, baseX, Math.min(1, drawH * 1.5));
  let u2x = 0, u2y = 0;
  if (ufo2.on) {
    const k = Math.min(1, ufo2.t / 1.6), e = 1 - Math.pow(1 - k, 3);
    u2x = lerp(W + 30, Math.min(W - 22, COWX + 44), e) + Math.sin(T * 1.1) * 2 + exitX * 1.2;
    u2y = UFO_Y + 22 + Math.sin(T * 1.9 + 1) * 1.5 + exitY * 1.1;
    if (ufo2.beam > 0.01) drawBeam2(u2x, u2y, cowX, cowBottom - 6, ufo2.beam, T);
  }
  const showCow = !(state === 'lost' && endT > 0.9);
  const legF = Math.floor(T * 8) % 2;
  g.save(); g.beginPath(); g.rect(-4, Math.round(cy) + 3, W + 8, H); g.clip();
  if (calf && calf.st === 'float') {
    const cb = lerp(GROUND + 6, baseY + 6, calf.h), cxx = baseX + Math.sin(T * 2 + calf.ph) * 4;
    drawCalf(cxx, cb, legF);
    if (Math.floor(T * 6) % 2) { R(cxx - 8, cb - 9, 1, 1, '#ffe14d'); R(cxx + 7, cb - 4, 1, 1, '#ffe14d'); R(cxx - 2, cb - 12, 1, 1, '#fff'); }
    else { R(cxx + 6, cb - 10, 1, 1, '#ffe14d'); R(cxx - 7, cb - 2, 1, 1, '#fff'); }
  }
  if (showCow) {
    drawCow(cowX, cowBottom, drawH > 0.03 ? legF : 0);
    if (calf && calf.st === 'carried') drawCalf(cowX - 2, cowBottom - 8, drawH > 0.03 ? 1 - legF : 0);
  }
  g.restore();
  if (beamStr > 0.01) {
    const a = 0.12 * beamStr;
    g.fillStyle = surgeOn ? `rgba(255,110,220,${a})` : `rgba(150,255,140,${a})`;
    const top = Math.round(cy) + 5;
    for (let y = top; y < GROUND + 5; y++) { const k = (y - top) / (GROUND + 5 - top), hw = Math.round(5 + k * 18); g.fillRect(Math.round(cx) - hw, y, hw * 2, 1); }
  }
  for (const p of parts) R(p.x, p.y, 1, 1, p.c);
  drawUFO(cx, cy, T, warn || surgeOn, beamStr > 0.3);
  if (ufo2.on) drawUFO(u2x, u2y, T + 0.5, false, ufo2.beam > 0.3, true);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

const els = { time: $('hudTime'), score: $('hudScore'), best: $('hudBest'), fill: $('meterFill'), danger: $('danger'), msg: $('msg') };
function hud() {
  const left = Math.max(0, Math.ceil(DUR - elapsed));
  els.time.textContent = String(left).padStart(2, '0');
  els.time.classList.toggle('hot', left <= 10 && state === 'play');
  els.score.textContent = pad(score);
  els.best.textContent = pad(Math.max(best, score));
  const p = Math.min(1, h);
  els.fill.style.height = (p * 100) + '%';
  els.fill.style.background = p < 0.5 ? '#5cff7a' : p < 0.8 ? '#ffe14d' : '#ff3d5a';
  els.danger.style.opacity = state === 'play' ? Math.max(0, (h - 0.6) / 0.4) * (0.6 + 0.4 * Math.sin(T * 20)) : 0;
  const cm = $('calfMark');
  if (state === 'play' && calf && calf.st === 'float') { cm.style.display = 'block'; cm.style.top = 'calc(var(--u) * ' + (25 + (1 - Math.min(1, calf.h)) * 72 - 1.5) + ')'; }
  else cm.style.display = 'none';
  let m = null, cls = '';
  if (state === 'play') {
    if (surgeOn) { m = '¡RAYO TURBO!'; }
    else if (warn) { m = '¡CUIDADO!'; cls = 'warn'; }
    else if (flash && T < flash.until) { m = flash.text; cls = flash.cls; }
    else if (calf && calf.st === 'carried') { m = '¡BÁJALA!'; cls = 'warn'; }
  }
  if (m) { els.msg.textContent = m; els.msg.className = 'on ' + cls; } else els.msg.className = '';
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw(); hud();
  requestAnimationFrame(frame);
}
function refit() { window.scrollTo(0, 0); fit(); }
addEventListener('resize', refit);
addEventListener('orientationchange', () => setTimeout(refit, 250));
addEventListener('pageshow', refit);
if (window.visualViewport) { visualViewport.addEventListener('resize', refit); visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0)); }
fit();
// mobile browsers settle their toolbars after load: re-measure a few times during the first seconds
[150, 500, 1000, 2000].forEach(ms => setTimeout(refit, ms));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitScreens);
// phones opened from a link (WhatsApp, etc.) can keep a shifted screen: reload once, one second after opening
try {
  if (matchMedia('(pointer: coarse)').matches && !sessionStorage.getItem('htc_reloaded')) {
    sessionStorage.setItem('htc_reloaded', '1');
    setTimeout(() => { if (state === 'title') location.reload(); }, 1000);
  }
} catch (e) {}
requestAnimationFrame(frame);
})();
</script>
</body>
